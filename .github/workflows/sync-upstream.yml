name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"  # 每6小时 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync code from upstream (merge-upstream)
        run: |
          echo "Syncing code from ViscousPot/GitSync..."
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/g1776933879/GitSync/merge-upstream \
            -d '{"branch":"main"}' || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync releases from upstream
        run: |
          node - <<'NODEEOF'
          const API='https://api.github.com';
          const UP='ViscousPot/GitSync', MY='g1776933879/GitSync';
          const T=process.env.GITHUB_TOKEN;
          const H={'Authorization':`Bearer ${T}`,'User-Agent':'sync-bot','Accept':'application/vnd.github+json'};
          async function gh(u,o={}){for(let i=0;i<3;i++){try{return await fetch(u,{...o,headers:{...H,...(o.headers||{})}});}catch(e){if(i===2)throw e;await new Promise(r=>setTimeout(r,3000));}}}
          (async()=>{
            // 上游全部 release
            let all=[],p=1;
            while(true){const r=await gh(`${API}/repos/${UP}/releases?per_page=50&page=${p}`);const d=await r.json();if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<50)break;p++;}
            // 我方全部 release
            let mine=[],mp=1;
            while(true){const r=await gh(`${API}/repos/${MY}/releases?per_page=50&page=${mp}`);const d=await r.json();if(!Array.isArray(d)||!d.length)break;mine=mine.concat(d);if(d.length<50)break;mp++;}
            const myMap=new Map(mine.map(r=>[r.tag_name,r]));
            let synced=0;
            for(const rel of all){
              const m=myMap.get(rel.tag_name);
              if(m && m.assets.length>=rel.assets.length) continue; // 已完整
              console.log(`syncing ${rel.tag_name}`);
              let relid=m&&m.id;
              if(!relid){
                const cr=await gh(`${API}/repos/${MY}/releases`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag_name:rel.tag_name,name:rel.name||rel.tag_name,body:rel.body||'',prerelease:rel.prerelease})});
                if(cr.status===201) relid=(await cr.json()).id;
                else {const er=await gh(`${API}/repos/${MY}/releases/tags/${rel.tag_name}`); if(er.ok) relid=(await er.json()).id;}
              }
              if(!relid){console.log(`  no relid for ${rel.tag_name}, skip`);continue;}
              const er2=await gh(`${API}/repos/${MY}/releases/${relid}`);
              const existing=new Set(er2.ok?(await er2.json()).assets.map(a=>a.name):[]);
              for(const a of rel.assets){
                if(existing.has(a.name))continue;
                console.log(`  + ${a.name} (${a.size} b)`);
                const dr=await gh(`${API}/repos/${UP}/releases/assets/${a.id}`,{headers:{'Accept':'application/octet-stream'},redirect:'manual'});
                if(dr.status!==302){console.log(`  redirect fail ${dr.status}`);continue;}
                const fr=await fetch(dr.headers.get('location'));
                if(!fr.ok){console.log(`  dl fail ${fr.status}`);continue;}
                const buf=Buffer.from(await fr.arrayBuffer());
                if(buf.length!==a.size){console.log('  size mismatch');continue;}
                const up=await gh(`https://uploads.github.com/repos/${MY}/releases/${relid}/assets?name=${encodeURIComponent(a.name)}`,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
                console.log(up.status===201?'  asset OK':'  UP FAIL '+up.status);
                synced++;
              }
            }
            console.log(`release sync done, ${synced} new assets`);
          })().catch(e=>{console.log('FATAL',String(e).slice(0,200));process.exit(1);});
          NODEEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}